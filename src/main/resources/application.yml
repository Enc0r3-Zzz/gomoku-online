spring:
  application:
    name: gomoku
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/gomoku?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:gomoku}
    password: ${DB_PASSWORD:gomoku_dev_2026}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: Asia/Shanghai
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  thymeleaf:
    cache: false
  web:
    resources:
      cache:
        period: 0

server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: false

logging:
  level:
    root: INFO
    com.example.gomoku: DEBUG
    org.flywaydb: INFO
