<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('大厅')}"></head>
<body class="app-page">
<header class="topbar">
    <a class="brand" th:href="@{/lobby}">五子棋 <span>ONLINE</span></a>
    <div class="userbox">
        <span class="avatar" th:text="${#strings.substring(user.nickname, 0, 1)}">E</span>
        <span class="nickname" th:text="${user.nickname}">玩家</span>
        <span class="rating-pill" th:text="${user.rating}">1200</span>
        <form th:action="@{/logout}" method="post" class="inline-form">
            <button type="submit" class="link-btn">退出</button>
        </form>
    </div>
</header>

<main class="lobby">
    <section class="card hero">
        <p class="eyebrow">M0 · SKELETON</p>
        <h1>准备开局</h1>
        <p class="muted">匹配功能将在 M2 开放，当前先验证注册、登录与数据库。</p>
        <div class="actions">
            <button class="btn primary" disabled title="M2 开放">开始匹配</button>
            <a class="btn ghost" th:href="@{/leaderboard}">查看排行榜</a>
        </div>
    </section>

    <section class="card stats">
        <h2>我的战绩</h2>
        <div class="stat-grid">
            <div class="stat"><span class="stat-value" th:text="${user.wins}">0</span><span class="stat-label">胜</span></div>
            <div class="stat"><span class="stat-value" th:text="${user.losses}">0</span><span class="stat-label">负</span></div>
            <div class="stat"><span class="stat-value" th:text="${user.draws}">0</span><span class="stat-label">平</span></div>
        </div>
        <p class="muted small">初始分 1200 · 排位赛 M4 开放</p>
    </section>
</main>
</body>
</html>
